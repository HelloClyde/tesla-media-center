name: Docker Image

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

# Serialize releases so an older upload cannot overwrite a newer latest tag.
concurrency:
  group: docker-image-release
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and publish AMD64 image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image configuration
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          HAS_ALIYUN: ${{ secrets.ALIYUN_REGISTRY != '' && secrets.ALIYUN_REGISTRY_NAMESPACE != '' && secrets.ALIYUN_REGISTRY_USERNAME != '' && secrets.ALIYUN_REGISTRY_PASSWORD != '' }}
        run: |
          echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "aliyun-enabled=$HAS_ALIYUN" >> "$GITHUB_OUTPUT"

      - name: Set up Python for asset verification
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Extract and verify pinned AMap server resources
        timeout-minutes: 5
        run: python tools/amap-app/release_assets.py

      - name: Extract AMap default offline voice
        run: python web/scripts/amap-tts/extract_assets.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta-ghcr
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha

      - name: Build and publish to GHCR
        timeout-minutes: 30
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker_build/Dockerfile
          push: true
          provenance: false
          platforms: linux/amd64
          tags: ${{ steps.meta-ghcr.outputs.tags }}
          labels: ${{ steps.meta-ghcr.outputs.labels }}
          cache-from: |
            type=gha,scope=tmc-amd64
            type=gha,scope=tmc-multiarch
          cache-to: type=gha,scope=tmc-amd64,mode=max,ignore-error=true,timeout=5m

      - name: Log in to Aliyun ACR
        if: steps.image.outputs.aliyun-enabled == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Docker metadata for Aliyun ACR
        id: meta-aliyun
        if: steps.image.outputs.aliyun-enabled == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.ALIYUN_REGISTRY }}/${{ secrets.ALIYUN_REGISTRY_NAMESPACE }}/${{ github.event.repository.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha

      # Reuse the local Buildx layers instead of downloading them from GHCR.
      - name: Build and publish to Aliyun ACR
        if: steps.image.outputs.aliyun-enabled == 'true'
        timeout-minutes: 40
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker_build/Dockerfile
          push: true
          # Aliyun does not accept Buildx provenance attestation manifests.
          provenance: false
          platforms: linux/amd64
          tags: ${{ steps.meta-aliyun.outputs.tags }}
          labels: ${{ steps.meta-aliyun.outputs.labels }}
          cache-from: type=gha,scope=tmc-amd64
