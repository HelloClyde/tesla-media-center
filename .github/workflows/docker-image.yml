name: Docker Image

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

# Serialize releases so an older upload cannot overwrite a newer latest tag.
concurrency:
  group: docker-image-release
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and publish to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      aliyun-enabled: ${{ steps.image.outputs.aliyun-enabled }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image configuration
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          HAS_ALIYUN: ${{ secrets.ALIYUN_REGISTRY != '' && secrets.ALIYUN_REGISTRY_NAMESPACE != '' && secrets.ALIYUN_REGISTRY_USERNAME != '' && secrets.ALIYUN_REGISTRY_PASSWORD != '' }}
        run: |
          echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "aliyun-enabled=$HAS_ALIYUN" >> "$GITHUB_OUTPUT"

      - name: Set up Python for asset verification
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/tts/requirements.txt

      - name: Download and verify pinned Amap runtime
        timeout-minutes: 5
        run: python tools/amap-app/release_assets.py

      - name: Download and verify browser Chinese TTS
        timeout-minutes: 10
        run: |
          python -m pip install -r tools/tts/requirements.txt
          python tools/tts/prepare_assets.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta-ghcr
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha

      - name: Build and publish to GHCR
        id: build
        timeout-minutes: 30
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker_build/Dockerfile
          push: true
          # Aliyun does not accept Buildx provenance attestation manifests.
          provenance: false
          platforms: linux/amd64
          tags: ${{ steps.meta-ghcr.outputs.tags }}
          labels: ${{ steps.meta-ghcr.outputs.labels }}
          cache-from: |
            type=gha,scope=tmc-amd64
            type=gha,scope=tmc-multiarch
          cache-to: type=gha,scope=tmc-amd64,mode=max,ignore-error=true,timeout=5m

  sync-aliyun:
    name: Sync published image to Aliyun
    needs: build-and-push
    if: needs.build-and-push.outputs.aliyun-enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install registry copy tool
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Docker metadata for Aliyun ACR
        id: meta-aliyun
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.ALIYUN_REGISTRY }}/${{ secrets.ALIYUN_REGISTRY_NAMESPACE }}/${{ github.event.repository.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha

      # Copy by immutable digest; rerunning only this failed job never rebuilds.
      - name: Copy AMD64 image with bounded retries
        timeout-minutes: 45
        env:
          REPOSITORY: ${{ github.repository }}
          SOURCE_DIGEST: ${{ needs.build-and-push.outputs.digest }}
          DESTINATION_TAGS: ${{ steps.meta-aliyun.outputs.tags }}
        # Public repository names can overlap a masked registry username.
        # Derive the address locally instead of passing it as a job output.
        run: |
          export SOURCE_IMAGE="ghcr.io/${REPOSITORY,,}"
          bash tools/ci/sync-image.sh
