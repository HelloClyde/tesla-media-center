<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>TMC 地点搜索</title></head><body>
<script>
'use strict';
let started = false;
window.addEventListener('message', function (event) {
  if (event.source !== parent || event.origin !== location.origin || started || event.data?.type !== 'tmc-search') return;
  started = true;
  const request = event.data;
  const reply = (data) => parent.postMessage({ type: 'tmc-search-result', ...data }, location.origin);
  if (request.securityCode) window._AMapSecurityConfig = { securityJsCode: request.securityCode };
  let searchStarted = false;
  const stage = (name) => parent.postMessage({ type: 'tmc-search-stage', stage: name }, location.origin);
  window.tmcSearchReady = async function () {
    if (searchStarted) return;
    searchStarted = true;
    const resolveCity = () => new Promise(resolve => {
      const center = request.center;
      if (!Array.isArray(center) || center.length !== 2 || !center.every(Number.isFinite)
        || Math.abs(center[0]) > 180 || Math.abs(center[1]) > 85) return resolve('全国');
      const cacheKey = 'tmc:search-city:' + center.map(n => n.toFixed(2)).join(',');
      try {
        const cached = JSON.parse(sessionStorage.getItem(cacheKey) || 'null');
        if (cached && typeof cached.city === 'string' && Date.now() - cached.time < 600000) return resolve(cached.city);
      } catch (_) {}
      let settled = false;
      const finish = (city) => {
        if (settled) return;
        settled = true; clearTimeout(timer);
        if (city !== '全国') {
          try { sessionStorage.setItem(cacheKey, JSON.stringify({ city, time: Date.now() })); } catch (_) {}
        }
        resolve(city);
      };
      const timer = setTimeout(() => finish('全国'), 2000);
      try {
        new AMap.Geocoder({ extensions: 'base' }).getAddress(center, (status, result) => {
          const address = result?.regeocode?.addressComponent;
          const city = typeof address?.city === 'string' && address.city
            || (['北京市', '上海市', '天津市', '重庆市'].includes(address?.province) ? address.province : '');
          finish(status === 'complete' && city ? city : '全国');
        });
      } catch (_) { finish('全国'); }
    });
    const query = (city) => new Promise((resolve, reject) => {
      stage('query');
      let settled = false;
      const finish = (error, pois = []) => {
        if (settled) return;
        settled = true; clearTimeout(timer);
        if (error) reject(error); else resolve(pois);
      };
      const timer = setTimeout(() => finish(new Error('高德地点搜索超时')), 8000);
      const callback = (status, result) => {
        if (status === 'no_data') return finish(null);
        if (status !== 'complete') {
          const info = typeof result === 'string' ? result : result?.info || 'UNKNOWN_ERROR';
          return finish(new Error('高德地点搜索失败：' + info));
        }
        if (!Array.isArray(result?.poiList?.pois)) return finish(new Error('高德搜索结果格式异常'));
        finish(null, result.poiList.pois);
      };
      try {
        const service = new AMap.PlaceSearch({ city, citylimit: false, pageSize: 20, pageIndex: 1, extensions: 'base' });
        service.search(request.keywords, callback);
      } catch (error) { finish(error); }
    });
    try {
      stage('query');
      const city = await resolveCity();
      // Prefer the current city without excluding explicit out-of-city keywords.
      // Never issue a parallel nearby query.
      let matches = await query(city);
      if (!matches.length && city !== '全国') matches = await query('全国');
      const ids = new Set();
      const pois = matches.filter(p => {
        if (!p.id || !p.location || ids.has(p.id)) return false;
        ids.add(p.id); return true;
      });
      reply({ status: 'ok', data: { coordinateSystem: 'GCJ-02', places: pois.map(p => {
        const entrance = Array.isArray(p.entrances) ? p.entrances.map(value => {
          const longitude = Number(value?.longitude ?? value?.lon ?? value?.getLng?.());
          const latitude = Number(value?.latitude ?? value?.lat ?? value?.getLat?.());
          return [longitude, latitude];
        }).find(([longitude, latitude]) => Number.isFinite(longitude) && Number.isFinite(latitude)
          && Math.abs(longitude) <= 180 && Math.abs(latitude) <= 85) : undefined;
        return {
          id: p.id, name: p.name,
          address: [p.pname, p.cityname, p.adname, typeof p.address === 'string' ? p.address : ''].filter(Boolean).join(' '),
          location: [p.location.getLng(), p.location.getLat()],
          ...(entrance ? { entrance } : {})
        };
      }) } });
    } catch (error) { reply({ status: 'error', message: error?.message || '高德搜索服务初始化失败' }); }
  };
  const script = document.createElement('script');
  script.src = 'https://webapi.amap.com/maps?v=1.4.15&plugin=AMap.PlaceSearch,AMap.Geocoder&callback=tmcSearchReady&key=' + encodeURIComponent(request.key);
  script.onload = () => { if (window.AMap && typeof window.AMap.PlaceSearch === 'function') window.tmcSearchReady(); };
  script.onerror = () => reply({ status: 'error', message: '高德搜索 SDK 加载失败，请检查网络' });
  stage('sdk-loading');
  document.head.appendChild(script);
});
parent.postMessage({ type: 'tmc-search-ready' }, location.origin);
</script></body></html>
